name: "Pecron Monitor HA App"
version: "0.1.0"
slug: pecron_monitor_ha_app
description: >-
  Monitor and control Pecron portable power stations through MQTT discovery
  entities, using the pecron-monitor library.
url: https://github.com/jrwagz/pecron-monitor-ha-app
stage: experimental
arch:
  - aarch64
  - amd64
init: false
timeout: 30
services:
  - "mqtt:need"
map:
  - type: app_config
    read_only: true
