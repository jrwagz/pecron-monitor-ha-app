[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["pecron_monitor_ha_app/app"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pecron_app"]
